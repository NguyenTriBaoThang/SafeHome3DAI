name: CI Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-test:
    name: Build, Lint & Automated Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: "file:./dev.db"
      NEXT_TELEMETRY_DISABLED: 1
      ONNXRUNTIME_NODE_INSTALL_CUDA: skip
      npm_config_onnxruntime_node_install_cuda: skip
      npm_config_legacy_peer_deps: "true"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps --onnxruntime-node-install-cuda=skip

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run CI Quality Gates (Secrets, Migrations, Contract & Auth)
        run: npm run qa:gates

      - name: TypeScript typecheck
        run: npx tsc --noEmit

      - name: Run Vietnamese 40Q RAG & Guardrail Benchmark (Offline)
        run: npm run eval:rag:a09

      - name: Vision provider contracts (offline, no database setup)
        run: npm run test:vision

      - name: Run automated test suite (Vitest)
        run: npm test -- --run

      - name: Build Next.js production bundle
        run: npm run build

      - name: Authenticated HTTP and restore checks (isolated accounts, no cloud calls)
        run: node scripts/completion/http-smoke.cjs
        env:
          SAFEHOME_BUILD_DIR: .next

      - name: Browser acceptance (isolated accounts and fixture detector)
        run: node scripts/completion/browser.cjs
        env:
          SAFEHOME_BUILD_DIR: .next

